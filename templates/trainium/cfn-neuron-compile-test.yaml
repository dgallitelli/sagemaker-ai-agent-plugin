AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Trainium EC2 instance for testing Neuron model compilation.
  Launch, SSH in, test models, terminate when done. Cost: ~$1.34/hr.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key pair for instance access

  InstanceType:
    Type: String
    Description: Trainium instance type
    Default: trn1.2xlarge
    AllowedValues:
      - trn1.2xlarge
      - trn1.32xlarge
      - trn1n.32xlarge

  AllowedSSHCidr:
    Type: String
    Description: CIDR block allowed for SSH (use your IP/32 for security)
    Default: 0.0.0.0/0

  VolumeSize:
    Type: Number
    Description: Root volume size in GB (for model downloads)
    Default: 200
    MinValue: 100
    MaxValue: 1000

  NeuronDLAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Neuron DLAMI from SSM Parameter Store
    Default: /aws/service/neuron/dlami/pytorch-2.5/ubuntu-22.04/latest/image_id

Resources:
  NeuronTestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Neuron compilation testing
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH access
      Tags:
        - Key: Name
          Value: neuron-compile-test-sg

  NeuronTestInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref NeuronDLAMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref NeuronTestSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: neuron-compile-test
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log) 2>&1
          echo "Setting up Neuron compilation test environment..."

          mkdir -p /home/ubuntu/neuron-test
          cd /home/ubuntu/neuron-test

          cat > test_neuron_compile.py << 'SCRIPT'
          #!/usr/bin/env python3
          """
          Test Neuron compilation for a HuggingFace model on Trainium.
          Usage: MODEL_ID="model/name" python test_neuron_compile.py
          Output saved to ~/neuron-test/last_test.log
          """
          import os
          import sys
          import time
          import io
          import re

          class TeeOutput:
              """Capture output to both console and string buffer."""
              def __init__(self):
                  self.buffer = io.StringIO()
                  self.stdout = sys.stdout
                  self.stderr = sys.stderr
              def write(self, data):
                  self.buffer.write(data)
                  self.stdout.write(data)
              def flush(self):
                  self.stdout.flush()
              def getvalue(self):
                  return self.buffer.getvalue()

          def test_compilation():
              model_id = os.environ.get("MODEL_ID", "meta-llama/Llama-3.2-1B")
              tee = TeeOutput()
              sys.stdout = tee
              sys.stderr = tee

              result = {"model": model_id, "status": "UNKNOWN", "memory_warning": False,
                        "error": None, "model_type": None, "params": None}

              print("=" * 60)
              print("Neuron Compilation Test")
              print("=" * 60)
              print(f"Model: {model_id}")
              print(f"Python: {sys.version.split()[0]}")
              print("=" * 60)

              print("\n[1/6] Checking environment...")
              try:
                  import torch
                  print(f"  PyTorch: {torch.__version__}")
              except ImportError as e:
                  print(f"  ERROR: PyTorch not available: {e}")
                  result["status"] = "FAILED"
                  result["error"] = "PyTorch not available"
                  return finish(result, tee)

              try:
                  import torch_neuronx
                  print(f"  torch-neuronx: available")
              except ImportError:
                  print(f"  torch-neuronx: NOT available")
                  result["status"] = "FAILED"
                  result["error"] = "torch-neuronx not available"
                  return finish(result, tee)

              try:
                  import torch_xla.core.xla_model as xm
                  print(f"  torch-xla: available")
              except Exception as e:
                  print(f"  torch-xla: error - {e}")

              print("\n[2/6] Checking transformers...")
              try:
                  import transformers
                  print(f"  transformers: {transformers.__version__}")
              except ImportError as e:
                  print(f"  ERROR: transformers not available: {e}")
                  result["status"] = "FAILED"
                  result["error"] = "transformers not available"
                  return finish(result, tee)

              print("\n[3/6] Loading tokenizer...")
              start = time.time()
              try:
                  from transformers import AutoTokenizer
                  tokenizer = AutoTokenizer.from_pretrained(model_id, trust_remote_code=True)
                  print(f"  Loaded in {time.time()-start:.1f}s, vocab: {tokenizer.vocab_size}")
              except Exception as e:
                  print(f"  ERROR: {e}")
                  result["status"] = "FAILED"
                  result["error"] = f"Tokenizer error: {str(e)[:100]}"
                  return finish(result, tee)

              print("\n[4/6] Loading model...")
              start = time.time()
              try:
                  from transformers import AutoModelForCausalLM
                  model = AutoModelForCausalLM.from_pretrained(
                      model_id,
                      torch_dtype=torch.bfloat16,
                      trust_remote_code=True,
                      attn_implementation="eager",
                  )
                  num_params = sum(p.numel() for p in model.parameters())
                  result["model_type"] = model.config.model_type
                  result["params"] = f"{num_params/1e9:.2f}B"
                  print(f"  Loaded in {time.time()-start:.1f}s")
                  print(f"  Type: {result['model_type']}, Params: {result['params']}")
              except Exception as e:
                  print(f"  ERROR: {e}")
                  result["status"] = "FAILED"
                  result["error"] = f"Model load error: {str(e)[:100]}"
                  return finish(result, tee)

              print("\n[5/6] Moving to Neuron (compilation)...")
              start = time.time()
              try:
                  import torch_xla.core.xla_model as xm
                  device = xm.xla_device()
                  model = model.to(device)
                  print(f"  Moved to {device} in {time.time()-start:.1f}s")
              except Exception as e:
                  error_str = str(e)
                  print(f"  ERROR: {e}")
                  result["status"] = "FAILED"
                  if "int64" in error_str.lower() or "matmul" in error_str.lower():
                      result["error"] = "int64 matmul not supported (incompatible)"
                  else:
                      result["error"] = f"Neuron error: {error_str[:100]}"
                  return finish(result, tee)

              print("\n[6/6] Forward pass...")
              start = time.time()
              try:
                  inputs = tokenizer("Hello", return_tensors="pt")
                  inputs = {k: v.to(device) for k, v in inputs.items()}
                  model.eval()
                  with torch.no_grad():
                      outputs = model(**inputs)
                  xm.mark_step()
                  print(f"  Completed in {time.time()-start:.1f}s")
                  print(f"  Output shape: {outputs.logits.shape}")
                  result["status"] = "PASSED"
              except Exception as e:
                  error_str = str(e)
                  print(f"  ERROR: {e}")
                  result["status"] = "FAILED"
                  if "int64" in error_str.lower():
                      result["error"] = "int64 matmul not supported (incompatible)"
                  else:
                      result["error"] = f"Forward pass error: {error_str[:100]}"
                  return finish(result, tee)

              # Check for memory warnings in output
              output = tee.getvalue()
              if "Failed to allocate" in output or "NRT_RESOURCE" in output:
                  result["memory_warning"] = True

              return finish(result, tee)

          def finish(result, tee):
              """Print summary and save log."""
              sys.stdout = tee.stdout
              sys.stderr = tee.stderr
              output = tee.getvalue()

              # Re-check memory warnings in captured output
              if "Failed to allocate" in output or "NRT_RESOURCE" in output:
                  result["memory_warning"] = True

              # Save full log
              log_path = os.path.expanduser("~/neuron-test/last_test.log")
              with open(log_path, "w") as f:
                  f.write(output)

              # Print copyable summary
              print("\n" + "=" * 60)
              if result["status"] == "PASSED":
                  print("RESULT: Neuron compilation test PASSED")
              else:
                  print("RESULT: Neuron compilation test FAILED")
              print("=" * 60)

              print("\n" + "#" * 60)
              print("# COPY THIS SUMMARY:")
              print("#" * 60)
              print(f"Model: {result['model']}")
              print(f"Status: {result['status']}")
              if result["model_type"]:
                  print(f"Architecture: {result['model_type']}")
              if result["params"]:
                  print(f"Parameters: {result['params']}")
              if result["memory_warning"]:
                  print(f"Memory Warning: YES (needs larger instance for training)")
              if result["error"]:
                  print(f"Error: {result['error']}")
              print("#" * 60)
              print(f"Full log: {log_path}")

              return result["status"] == "PASSED"

          if __name__ == "__main__":
              success = test_compilation()
              sys.exit(0 if success else 1)
          SCRIPT

          chown -R ubuntu:ubuntu /home/ubuntu/neuron-test
          chmod +x /home/ubuntu/neuron-test/test_neuron_compile.py
          echo "Setup complete!"

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref NeuronTestInstance

  PublicIP:
    Description: Public IP address
    Value: !GetAtt NeuronTestInstance.PublicIp

  SSHCommand:
    Description: SSH command
    Value: !Sub 'ssh -i <key>.pem ubuntu@${NeuronTestInstance.PublicIp}'

  TestOneLiner:
    Description: One-liner to SSH and run test
    Value: !Sub |
      ssh -i <key>.pem ubuntu@${NeuronTestInstance.PublicIp} "source /opt/aws_neuronx_venv_pytorch_2_5_nxd_training/bin/activate && pip install -q 'transformers>=5.0' && cd ~/neuron-test && MODEL_ID='<model-id>' python test_neuron_compile.py"

  DeleteCommand:
    Description: Delete stack when done
    Value: !Sub 'aws cloudformation delete-stack --stack-name ${AWS::StackName} --region ${AWS::Region}'

  HourlyCost:
    Description: Estimated cost
    Value: '$1.34/hour for trn1.2xlarge - TERMINATE WHEN DONE!'
