AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Trainium EC2 instance for testing Neuron model compilation.
  Launch, SSH in, test models, terminate when done. Cost: ~$1.34/hr.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key pair for instance access

  InstanceType:
    Type: String
    Description: Trainium instance type
    Default: trn1.2xlarge
    AllowedValues:
      - trn1.2xlarge
      - trn1.32xlarge
      - trn1n.32xlarge

  AllowedSSHCidr:
    Type: String
    Description: CIDR block allowed for SSH (use your IP/32 for security)
    Default: 0.0.0.0/0

  VolumeSize:
    Type: Number
    Description: Root volume size in GB (for model downloads)
    Default: 200
    MinValue: 100
    MaxValue: 1000

  NeuronDLAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Neuron DLAMI from SSM Parameter Store
    Default: /aws/service/neuron/dlami/pytorch-2.5/ubuntu-22.04/latest/image_id

Resources:
  NeuronTestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Neuron compilation testing
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH access
      Tags:
        - Key: Name
          Value: neuron-compile-test-sg

  NeuronTestInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref NeuronDLAMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !Ref NeuronTestSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: neuron-compile-test
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/user-data.log) 2>&1
          echo "Setting up Neuron compilation test environment..."

          mkdir -p /home/ubuntu/neuron-test
          cd /home/ubuntu/neuron-test

          cat > test_neuron_compile.py << 'SCRIPT'
          #!/usr/bin/env python3
          """
          Test Neuron compilation for a HuggingFace model on Trainium.
          Usage: MODEL_ID="model/name" python test_neuron_compile.py
          """
          import os
          import sys
          import time

          def test_compilation():
              model_id = os.environ.get("MODEL_ID", "meta-llama/Llama-3.2-1B")
              print("=" * 60)
              print("Neuron Compilation Test")
              print("=" * 60)
              print(f"Model: {model_id}")
              print(f"Python: {sys.version}")
              print("=" * 60)

              print("\n[1/6] Checking environment...")
              try:
                  import torch
                  print(f"  PyTorch: {torch.__version__}")
              except ImportError as e:
                  print(f"  ERROR: PyTorch not available: {e}")
                  return False

              neuron_available = False
              try:
                  import torch_neuronx
                  print(f"  torch-neuronx: available")
                  neuron_available = True
              except ImportError:
                  print(f"  torch-neuronx: NOT available")
                  return False

              try:
                  import torch_xla.core.xla_model as xm
                  print(f"  torch-xla: available")
                  print(f"  XLA devices: {xm.get_xla_supported_devices()}")
              except Exception as e:
                  print(f"  torch-xla: error - {e}")

              print("\n[2/6] Checking transformers...")
              try:
                  import transformers
                  print(f"  transformers: {transformers.__version__}")
              except ImportError as e:
                  print(f"  ERROR: transformers not available: {e}")
                  return False

              print("\n[3/6] Loading tokenizer...")
              start = time.time()
              try:
                  from transformers import AutoTokenizer
                  tokenizer = AutoTokenizer.from_pretrained(model_id, trust_remote_code=True)
                  print(f"  Loaded in {time.time()-start:.1f}s, vocab: {tokenizer.vocab_size}")
              except Exception as e:
                  print(f"  ERROR: {e}")
                  import traceback; traceback.print_exc()
                  return False

              print("\n[4/6] Loading model...")
              start = time.time()
              try:
                  from transformers import AutoModelForCausalLM
                  model = AutoModelForCausalLM.from_pretrained(
                      model_id,
                      torch_dtype=torch.bfloat16,
                      trust_remote_code=True,
                      attn_implementation="eager",
                  )
                  num_params = sum(p.numel() for p in model.parameters())
                  print(f"  Loaded in {time.time()-start:.1f}s")
                  print(f"  Type: {model.config.model_type}, Params: {num_params/1e9:.2f}B")
              except Exception as e:
                  print(f"  ERROR: {e}")
                  import traceback; traceback.print_exc()
                  return False

              print("\n[5/6] Moving to Neuron (compilation)...")
              start = time.time()
              try:
                  import torch_xla.core.xla_model as xm
                  device = xm.xla_device()
                  model = model.to(device)
                  print(f"  Moved to {device} in {time.time()-start:.1f}s")
              except Exception as e:
                  print(f"  ERROR: {e}")
                  import traceback; traceback.print_exc()
                  return False

              print("\n[6/6] Forward pass...")
              start = time.time()
              try:
                  inputs = tokenizer("Hello", return_tensors="pt")
                  inputs = {k: v.to(device) for k, v in inputs.items()}
                  model.eval()
                  with torch.no_grad():
                      outputs = model(**inputs)
                  xm.mark_step()
                  print(f"  Completed in {time.time()-start:.1f}s")
                  print(f"  Output shape: {outputs.logits.shape}")
              except Exception as e:
                  print(f"  ERROR: {e}")
                  import traceback; traceback.print_exc()
                  return False

              print("\n" + "=" * 60)
              print("RESULT: Neuron compilation test PASSED")
              print("=" * 60)
              return True

          if __name__ == "__main__":
              success = test_compilation()
              sys.exit(0 if success else 1)
          SCRIPT

          chown -R ubuntu:ubuntu /home/ubuntu/neuron-test
          chmod +x /home/ubuntu/neuron-test/test_neuron_compile.py
          echo "Setup complete!"

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref NeuronTestInstance

  PublicIP:
    Description: Public IP address
    Value: !GetAtt NeuronTestInstance.PublicIp

  SSHCommand:
    Description: SSH command
    Value: !Sub 'ssh -i <key>.pem ubuntu@${NeuronTestInstance.PublicIp}'

  TestOneLiner:
    Description: One-liner to SSH and run test
    Value: !Sub |
      ssh -i <key>.pem ubuntu@${NeuronTestInstance.PublicIp} "source /opt/aws_neuronx_venv_pytorch_2_5_nxd_training/bin/activate && pip install -q 'transformers>=5.0' && cd ~/neuron-test && MODEL_ID='<model-id>' python test_neuron_compile.py"

  DeleteCommand:
    Description: Delete stack when done
    Value: !Sub 'aws cloudformation delete-stack --stack-name ${AWS::StackName} --region ${AWS::Region}'

  HourlyCost:
    Description: Estimated cost
    Value: '$1.34/hour for trn1.2xlarge - TERMINATE WHEN DONE!'
